# SPDX-License-Identifier: Apache-2.0

description:
  DJI VT13 / VT03 image transmission remote controller. 921600 8N1,
  21-byte frame starting with 0xA9 0x53 and ending with a CRC16.

compatible: "rp,vt13-remote"

properties:
  uart:
    type: phandle
    required: true
    description: |
      UART peripheral used for remote communication.

  label:
    type: string
    description: |
      Human readable string describing the Remote. It can be used by an
      application to identify this Remote or to retrieve its number/index
      (i.e. child node number) on the parent device.
